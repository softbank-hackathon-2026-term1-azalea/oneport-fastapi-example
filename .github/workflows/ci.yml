name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["1.1.1", "2.2.2", "3.3.3"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fastapi:
    name: FastAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app tests

      - name: Test
        run: uv run pytest -q

      - name: Build image from repository root
        run: docker build --platform linux/amd64 --build-arg GIT_SHA="$GITHUB_SHA" -t oneport-fastapi-example:ci .

      - name: Verify image version and non-root user
        run: |
          expected_version=$(uv run python -c 'from app.core.release import project_version; print(project_version())')
          docker run --rm --entrypoint python -e EXPECTED_VERSION="$expected_version" oneport-fastapi-example:ci \
            -c 'import os; from app.core.release import project_version; assert os.getuid() == 999; assert project_version() == os.environ["EXPECTED_VERSION"]; print(project_version())'
