[project]
name = "notes"
version = "1.2.1"
description = "Oneport demo notes app (FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.120,<1.0",
    "sqlalchemy[asyncio]>=2.0.40,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.16,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "asgi-correlation-id>=4.3,<5.0",
    "redis>=6.2,<8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    "testcontainers[postgres,redis]>=4.9,<5.0",
    "ruff>=0.12,<1.0",
    "mypy>=1.14,<2.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG001",
    "T201",
]
ignore = [
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
